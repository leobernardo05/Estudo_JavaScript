<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <div id="teste"></div>
    <script>
        function* testeGenerator(){
            console.log('teste 1')
            yield console.log('teste 2') //executa tudo que vem antes dela!
            console.log('teste 3')

            return 'Teste 4'
        }
        let meuGenerator = testeGenerator() //objeto iterator
        console.log(meuGenerator)
        meuGenerator.next() //next é palavra reservada - que executa toda a function
        console.log('------')
        meuGenerator.next()
        console.log('--------')
        console.log(meuGenerator.next())
    </script>
</body>
</html>
