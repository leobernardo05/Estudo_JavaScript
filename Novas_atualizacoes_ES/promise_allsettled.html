<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <body></body>
    <script>
       const promise1 = new Promise((resolve, reject) => {
            return setTimeout(() =>  resolve('Promise 1 resolvida'),2000)
       })

       const promise2 = new Promise((resolve, reject) => {
            return setTimeout(() =>  resolve('Promise 2 resolvida'),2000)
       })

       const promise3 = new Promise((resolve, reject) => {
            return setTimeout(() =>  resolve('Promise 3 resolvida'),2000)
       })

       const promises = [promise1, promise2, promise3];

       Promise.allSettled(promises) //é um método estático do JavaScript que recebe um array de promessas (promises) e retorna uma única promessa.
       //retorna uma unica promise a partir de varias, como no exemplo
            .then((resultados)=> {
                resultados.forEach(resultado => {
                    if(resultado.status == 'fulfilled') {
                        console.log(resultado.value)
                    } else {
                        console.log(resultado.reason) // é um objeto que representa a eventual conclusão ou falha de uma operação assíncrona, agindo como um "marcador"
                    }
                })
            })
    </script>
