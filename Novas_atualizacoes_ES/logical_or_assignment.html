    <body></body>
    <script>
        // false -> null, undefined, 0, '' --> or assignment!
        let v1 = 10
        let v2 = undefined //false
        let v3 = null //false
        let v4 = 0 //false
        let v5 = '' //false
        let v6 = 'uma string' 
        //logical or Assignment (||=)
        v1 ??= 50 
        v2 ??= 20 //false
        v3 ??= 20 //false
        v4 ??= 20 //false
        v5 ??= 20 //false
        v6 ??= 20

        console.log("Esse é o v1: " + v1)
        console.log("Esse é o v2: " + v2)
        console.log("Esse é o v3: " + v3)
        console.log("Esse é o v4 " + v4)
        console.log("Esse é o v5: " + v5)
        console.log("Esse é o v6: " + v6)

        
    </script>
