<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       let texto = '                       teste                   '
       console.log('.'+ texto.trimStart()) //remove no inicio
       console.log(texto)
       console.log('.' + texto.trimEnd) //remove ao final
       
       //-----------

       console.log('.' + texto.trimLeft()) //remove a esquerda
       console.log('.' + texto.trimRight().trimLeft() + '.') //remove a esqueda e a direita
    </script>
</body>
</html>
