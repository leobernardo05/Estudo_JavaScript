<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
        // estudo weakmap   
        obj1 = {
            nome: 'Leonardo',
            profissao: 'Programador'
        }

        obj2 = {
            nome: 'Gabriela',
            profissao: 'Fisioterapeuta'
        }

        const objetos = new Weakmap();
        objetos.set(obj1, 'Informações do objeto 1')
        objetos.set(obj2, 'Informações do objeto 2')

        // não podemos percorrer esse WeakMap
        console.log(objetos)

        obj1 = null //Wealmap é responsavel por limpar a memoria e não deixar problemas como visto na aula p1.
        
        console.log(objetos); //GC
        
    </script>
</body>
</html>
