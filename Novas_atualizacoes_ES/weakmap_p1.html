<body>
    <script>
        // estudo weakmap   
        obj1 = {
            nome: 'Leonardo',
            profissao: 'Programador'
        }

        obj2 = {
            nome: 'Gabriela',
            profissao: 'Fisioterapeuta'
        }

        // Wealmap ->  Referencia e vazamento de memoria

        const objetos = [obj1, obj2]; //referencias
        
        console.log('Original'); 
        objetos.map((value, index) => console.log(index, value));

        obj2 = null
        //obj2.nome = 'João Brandão' //referencia para o objeto nome
        objetos[1].nome = 'João Brandão' // vazamento de memoria!!!!! --> problema
        
        console.log("resultado")
        objetos.map((value, index) => console.log(index,value))
        
        console.log(obj2)

    </script>
