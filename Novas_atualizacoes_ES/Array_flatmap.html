<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       let nomes = [
        'Zeca, João, Maria',
        'Zacarias, Rafel, Claudia',
        'Joaquim, Creuza, Zefa'
       ]
       console.log(nomes)

       let nomesMap = nomes.map(item => {
            return item.split(',')
       })

       console.log(nomesMap)

        let nomesFlatMap = nomes.flatMap(item => { //localiza a partir das ',' mais completo
            return item.split(',')
       })
       console.log(nomesFlatMap)
    </script>
</body>
</html>
