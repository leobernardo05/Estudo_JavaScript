<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
        // promise pode ser resolvida (resolve) ou rejeitada (reject)
        let p = new Promise((resolve,reject) => {
            if(false){
                reject('Rejeitada')
            }
            resolve('Resolvida')
        })
        .then((resultado) => {
            console.log(resultado)
        }).catch((rejeitado) => {
            console.log(rejeitado)
        }).finally(() => {
            console.log('FLuxo se rejeitado ou resolvido')
        })
    </script>
</body>
</html>
