<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
    <body></body>
    <script>
        // feature paticular do ES13
        class Agenda {
           #titulo = ''
           eventos = []

           static config = {}
           static #eventosRecorrentes = []
           
           constructor (titulo, eventos) {
                console.log('Executando o construtor')
                this.#titulo = titulo //atributo privado por causa do hash (#)
                this.eventos = eventos
           }

            // blocos estáticos são executados na inicialização da classe, pois não exigem a instância da clase
           static {
                console.log('Executando bloco estatico de código');
           }

           static {
                this.config = {
                    tema: 'dark',
                    visualizacao: 'mensal'
                }
           }

           static {
                this.eventosRecorrentes.push('Feriado 1')
                this.eventosRecorrentes.push('Feriado 2')
           }

           static get eventosRecorrentes(){
                return this.#eventosRecorrentes
           }

           static set eventosRecorrentes(evento){
                this.#eventosRecorrentes.push(evento)
           }
        }

        const agenda = new Agenda('Cliente', ['Reunião 1', 'Reunião 2'])
        console.log(agenda)

        const agenda2 = new Agenda('Cliente 2', ['Reunião 2', 'Reunião 3'])
        console.log(agenda2)
        console.log(Agenda.config)
    </script> 
</html>_
