<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
        //requisição HTTP 
        let resposta = {}
       let promesa = new Promise((resolve, reject) => {
        try {
            setTimeout(() => {
                resposta = {dados: {msg: 'Recuperamos os dados com sucesso'}}
                resolve ('Promesa concluida com sucesso')  
            }, 3000)
        } catch(e){
            setTimeout(() => {
                reject (e) 
            }, 3000)
        }
       })
    
       setTimeout(() => {
                console.log(promesa)     
                console.log(resposta)     
            }, 4000)
    </script>
</body>
</html>
