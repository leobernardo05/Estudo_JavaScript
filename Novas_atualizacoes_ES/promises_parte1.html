<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       let promesa = new Promise((resolve, reject) => {
        try {
            setTimeout(() => {
                resolve ('Promesa concluida com sucesso')     
            }, 3000)
        } catch(e){
            setTimeout(() => {
                reject (e)     
            }, 3000)
        }
       })
       console.log(promesa)
    </script>
</body>
</html>
