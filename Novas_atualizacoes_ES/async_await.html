<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       let processoAssincrono = new Promise((resolve, reject) => {
            setTimeout(()=> resolve ('Sucesso no processo assincrono'), 3000)
       })

       function recuperarDados () {
            processoAssincrono.then(p => console.log(p))

            console.log('processamento assincrono 1')

            fetch('https://jsonplaceholder.typicode.com/comnents') //auxillia na requisição http
                .then(r => r.json())
                .then(d => console.log(d))

            fetch('https://jsonplaceholder.typicode.com/posts')
                .then(r => r.json())
                .then(d => console.log(d))
       }

       recuperarDados()
       console.log('fim')

    </script>
</body>
</html>
