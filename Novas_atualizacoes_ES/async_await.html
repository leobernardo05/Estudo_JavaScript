<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       let processoAssincrono = new Promise((resolve, reject) => {
            setTimeout(()=> resolve ('Sucesso no processo assincrono'), 3000)
       })

        async function recuperarDados () { //define que a função é assincrona
            await processoAssincrono.then(p => console.log(p)) //await --> aguardar

            console.log('processamento assincrono 1')

            await fetch('https://jsonplaceholder.typicode.com/comments') //auxillia na requisição http
                .then(r => r.json())
                .then(d => console.log('COMMENTS: ',d))

            console.log('processamento assincrono 2')

            await fetch('https://jsonplaceholder.typicode.com/posts')
                .then(r => r.json())
                .then(d => console.log('POSTS: ',d))
            
            console.log('processamento assincrono 3')

       }

       recuperarDados()//.then or .catch
       console.log('fim')

    </script>
</body>
</html>
