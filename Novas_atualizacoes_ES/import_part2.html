<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
    <body>
        <button id="btnSaudacao">Saudação</button>
        <hr>
        <input type="text" id="cep" placeholder="CEP">
        <button id="btnCEP">Consultar CEP</button>
    </body>
    <!-- obrigatoriamente tem que indicar que é um modulo! -->
    <script type="module">
        // (estatico) carregando o módulo antes da necessidade de utilizá-lo
        // import {saudacao, getEnderecoByCEP} from './import/lib.mjs'

        document.querySelector('#btnSaudacao').addEventListener('click', () => {
            import ('./import/lib.mjs')   
                .then(mod => {
                    console.log(mod.saudacao())
                })
        })        

        document.querySelector('#btnCEP').addEventListener('click', () => {
            
            let cep = document.querySelector('#cep').value
            
            if(cep.length == 8) {
                
                import ('./import/lib2.mjs')   
                    .then(mod => {
                        return mod.getEnderecoByCEP(cep)
                    })
                    .then(dados => {
                        console.log(dados)
                    })
                    .catch(erro => {
                        console.error("Erro ao buscar CEP:", erro)
                    })
            }
        })        



        


        </script>
</html>
