<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <div id="teste"></div>
    <script>
       function* conversar () {
        let opcao = yield 'E ai, tudo bem?'

        // o parametro enviado no next
        yield 'Otimo, fico feliz'

        yield 'Terceira etapa' + opcao
       }
       function acao () {
        let iteracao = conversa.next() //
        console.log(iteracao)

        iteracao = conversa.next('sim') //
        console.log(iteracao)

        iteracao = conversa.next() //
        console.log(iteracao)
       }

       let conversa = conversar() //objeto iterador

       let iteracao = conversa.next() //
       console.log(iteracao)

       iteracao = conversa.next('sim')
       console.log(iteracao)

       iteracao = conversa.next() //
       console.log(iteracao)
       
    </script>
</body>
</html>
