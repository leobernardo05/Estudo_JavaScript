<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
       function* conversar () {
        // escopo proprio
        // opcao

        // 1 bloco
        let opcao = yield 'E ai, tudo bem?'

        // 2 bloco
        // o parametro enviado no next
        if(opcao == 'sim') {
            yield 'Ótimo, fico feliz' 
            
            opcao = yield 'Como posso te ajudar? Quer uma piada?'

            if (opcao == 'sim'){
                fetch('piadas.json')
                    .then(response => response.json())
                    .then(piadas => {
                        if(piadas.length > 0) {
                            let idx = Math.floor(Math.random() * piadas.length)
                            let piada = piadas[idx]

                            console.log(piada)
                        }
            }) 
                yield 'Te contei a piada no console 😅 (olha lá)'
            } else {
                yield 'digite 1 para compras, 2 par vendas ou 3 para falar com um atendente'
            }
        } else {
            yield 'Respire fundo e tenha paciência'
            
            yield 'digite 1 para compras, 2 par vendas ou 3 para falar com um atendente'
        }
        return 'Atendimento finalizado'
       }
       
       let conversa = conversar() //objeto iterador

       function acao () {
            let resposta = document.getElementById('resposta').value
            let iteracao = conversa.next(resposta) //
            console.log(iteracao)
       }
       
    </script>
    <div id="teste">
        <button type="button" onclick="acao()">Avançar</button>
        Resposta: <input type="text" id="resposta">
    </div>
</body>
</html>
