<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo JS</title>
</head>
<body>
    <script>
      //padStart (preechimento a esquerda)
      let codigo = '1000';
      //expectitativa 0000001000
      codigo = codigo.padStart(10, '0') //acresimo a esquerda
      console.log(codigo)

      // padEnd (preenchimento a direita)
      let codigo2 = '8888'
      codigo2 = codigo2.padEnd(10, '0')
      console.log(codigo2)
    </script>
</body>
</html>
