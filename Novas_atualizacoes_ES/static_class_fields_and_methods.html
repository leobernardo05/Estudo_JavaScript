    <script>
        class Funcionario {
            departamento = "RH"
            salario = 3500
            static #primeiroNome = 'João' //static -> torna reutilizavel sem a instância da classe
            static #ultimoNome = 'Maciel'

            static #nomeCompleto (){ 
                return `${this.#primeiroNome} $this.{ultimoNome}`
            }

            static showNome () {
                return this.#nomeCompleto
            }
        }

        // exemplo pratico
        class Filme {
            static proximoIdFilme = 1

            constructor (titulo) {
                this.titulo = titulo 

                
                this.Id = Filme.proximoIdFilme
                Filme.proximoIdFilme++;
            }

            static getProximoIdFilme () {
                return Filme.proximoIdFilme
            }
        }

        const filme1 = new Filme('O pior filme do mundo')
        console.log(filme1)
        
        console.log(Filme.getProximoIdFilme) //não precisa instanciar a classe para utilizar seus atributos
