    <script>
        // exercicio 09 ---- Encontrar o segundo maior número
        function segundoMaior (numRep) {
            numeros = []
            for (let i = 0; i < numRep;i++) {
                num = parseInt(prompt('digite um num: '))
                numeros.push(num)
            }
        }
        let numRep = parseInt(prompt('digite quantos numeros você quer no seu array: '))
        console.log(`o segundo maior numero é: ${numRep}`)

    </script>
