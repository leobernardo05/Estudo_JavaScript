<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Estudo JS</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
 <div class="mt-5 d-flex flex-column align-items-center">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 20px;">
        <h2 class="text-center mb-4">Gerenciador de tarefas</h2>
        <!-- input titulo  -->
        <input 
            id="titulo"
            type="text" 
            class="form-control mb-3" 
            id = "titulo"
            placeholder="Título da atividade"
        >
        <!-- descrição -->
        <input 
            type="text" 
            class="form-control mb-3" 
            id="descricao"
            placeholder="Descrição da atividade"
        >
        <!-- botão para inserir dados -->
        <button 
            class="btn btn-success w-100 fw-bold" 
            id="botaoInserir"
            onclick="inserirAtividades()"
        >
            Inserir
        </button>
        <!-- botão listar tarefas -->
        <button 
            class="btn btn-danger mt-2 w-100 fw-bold" 
            id="botaoMostrar"
            onclick="mostrarAtividades()"
        >
            Mostrar atividades
        </button>
    </div>
    <div id="lista"></div>
</div>
</body>
</html>
