<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- inicio estilo -->
    <style>
        .containner {
            background-color: rgb(237, 233, 228);
            width: 380px;
            height: 180px;
            border-radius: 6px;
            border: 1px solid black ;
            margin: auto;
            box-shadow: 5px 5px 10px rgba(0, 0,0,0.5);
        }

        h4 {
            margin-bottom: 6px;
            color: black;
            text-align: center;
            text-transform: uppercase;
        }

        input {
            border-radius: 5px;
            margin: 5px;
            padding: 5px;
            width: 90%;
        }

        button {
            margin: 0 auto;
            color: white;
            background-color: brown;
            width: 100%;
            border-radius: 5px;
            padding: 5px;
        }
    </style>
    <!-- fim estilo -->
</head>
    <!-- inicio corpo html -->
    <body>
        <div class="containner">
            <h4>Validador de senha</h4>
            <input type="email" placeholder="digite seu email" name="email" id="email">
            <input type="password" placeholder="digite sua senha" name="senha" id="senha">
            <button onclick="verificar()">verificar</button>
            <p style="color: red; margin: auto;" id="erro"></p>
        </div>
    </body>
    <!-- fim corpo html -->

     <!-- inicio JS -->
    <script>
        // ------------- Ex-02 validador de senha (usar REGEX) ------------
        function verificar () {
            let senha = document.getElementById('senha').value //tranformar em numero
            let email = document.getElementById('email').value //sem .value é apenas uma string
            
            // implementação de regex
            let temNumero = /[0-9]/.test(senha) //recebe o teste regex
            let temMaiuscula = /[A-Z]/.test(senha) //recebe o teste regex
            let temMinuscula = /[a-z]/.test(senha) //recebe o teste regex
            let erro = [] //array para armazenar erros
        
            // verificação de tamanho
            if (!(senha.length <= 8 && senha.length >= 5)) {
                erro.push('Digite entre 5 e 8 caracteres')
            }
            // verificação se tem numero
            if (!temNumero) {
                erro.push('Digite ao menos um numero')
            }
            // verificação de letras maiusculas
            if (!temMaiuscula) {    
                erro.push('Digite pelo menos uma letra maiuscula')
            } 
            // verificação de letras minusculas
            if (!temMinuscula) {
                erro.push('Digite pelo menos uma letra minuscula')
            }
            
            let paragrafo = document.getElementById('erro')
            // exibição
            if (erro.length === 0) {
                paragrafo.style.color = "green"
                paragrafo.innerHTML = "Senha válida ✅"
            } else {
                paragrafo.style.color = "red"
                paragrafo.innerHTML = erro.join('<br>')
            }

            /*if (senha.length <= 8 && senha.length >= 5 && temNumero && temMaiuscula && temMinuscula)  {
                alert('senha valida')
            } else {
                alert('senha invalida')
            }*/
        }
    </script>
    <!-- fim JS -->
</html>
