<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Carrinho de Compras</h2>

        <input type="text" id="produto" placeholder="Produto">
        <input type="number" id="valor" placeholder="Valor">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="number" id="desconto" placeholder="Desconto">

        <button onclick="adicionarLista()">Adicionar</button>
        <button onclick="somarProdutos()">Somar</button>
        <button onclick="aplicarDesconto()">Aplicar Desconto</button>

        <h3>Total: R$ <span id="resultado">0.00</span></h3>

        <h3>Lista:</h3>
        <ul id="lista"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
