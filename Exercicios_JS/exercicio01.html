        // utilizando funções ------- mais profissional
        function soma (n){
            var somaPares = 0

            for (var x = 0; x <= n; x++){
                // verificação se é par
                if (x % 2 == 1) {
                    continue
                }
                // soma dos pares apos percorrer o laço
                somaPares += x
            }
            return somaPares
        }
        // teste
        let n = parseInt(prompt('Digite um numero: '))
        console.log(`a soma dos pares é: ${soma(n)}`)
